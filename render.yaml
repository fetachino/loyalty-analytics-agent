services:
  - type: web
    name: loyalty-analytics-agent
    runtime: docker
    plan: free
    region: ohio
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    initialDeployHook: python scripts/bootstrap_admin.py
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RUN_MIGRATIONS
        value: "true"
      - key: BOOTSTRAP_ADMIN
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: AGENT_APPROVAL_EXPIRE_MINUTES
        value: "15"
      - key: LANGGRAPH_STRICT_MSGPACK
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: loyalty-analytics-db
          property: connectionString
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: ANALYTICS_PROVIDER
        value: postgresql
      - key: SNOWFLAKE_FALLBACK_TO_POSTGRESQL
        value: "true"
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_PASSWORD
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        value: LOYALTY_ANALYTICS_WH
      - key: SNOWFLAKE_DATABASE
        value: LOYALTY_ANALYTICS
      - key: SNOWFLAKE_SCHEMA
        value: ANALYTICS
      - key: SNOWFLAKE_ROLE
        value: LOYALTY_ANALYTICS_APP
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Loyalty Administrator

databases:
  - name: loyalty-analytics-db
    plan: free
    region: ohio
    postgresMajorVersion: "17"
    databaseName: loyalty
    user: loyalty
    ipAllowList: []
