[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loyalty-analytics-agent"
version = "1.0.0"
description = "Production loyalty analytics platform with a constrained AI analyst"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=46,<50",
  "fastapi>=0.115,<1",
  "faker>=30,<40",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "openai>=2.0,<3",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "pwdlib[argon2]>=0.3,<1",
  "pyjwt>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "snowflake-connector-python>=3.18,<5",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loyalty_analytics"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=loyalty_analytics --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = "faker.*"
ignore_missing_imports = true
